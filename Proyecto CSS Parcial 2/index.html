<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Cocina de Lu - Menú</title>

  <!-- Favicon en la pestaña -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" type="image/png">

  <!-- Enlace al archivo CSS en la carpeta css/ -->
  <link rel="stylesheet" href="css/estilos.css">

</head>
<body>

  <h1>Menú Diario de Comida Rápida</h1>
  <p>Haz clic en un día para ver la especialidad diaria:</p>

  <!-- Botones de Lunes a Viernes -->
  <div class="botones">
    <button onclick="verMenu('lunes')">Lunes</button>
    <button onclick="verMenu('martes')">Martes</button>
    <button onclick="verMenu('miercoles')">Miércoles</button>
    <button onclick="verMenu('jueves')">Jueves</button>
    <button onclick="verMenu('viernes')">Viernes</button>
  </div>

  <!-- Tarjeta interactiva -->
  <div class="card">
    <h2 id="dia">Lunes</h2>
    <img id="imagen" src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Platillo del día">
    <p id="platillo">Hamburguesa Doble Carne con Queso</p>
  </div>

  <!-- Enlace al archivo JS en la carpeta js/ -->
  <script src="js/script.js"></script>

</body>
</html>
